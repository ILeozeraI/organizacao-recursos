name: qualidade

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para o SonarCloud

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar (testes + gate de cobertura JaCoCo)
        run: ./mvnw -B verify

      - name: Análise SonarCloud
        # Só roda quando o secret existe (forks e PRs externos não recebem secrets).
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B -DskipTests org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-${{ github.run_number }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar relatório de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ github.run_number }}
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 30
