spring:
  application:
    name: organizacao-recursos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recursos}
    username: ${DB_USER:recursos}
    password: ${DB_PASSWORD:recursos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

app:
  sessao:
    validade: PT8H
  notificacao:
    # RF11: provedor externo de notificação (simulado). Valores vêm de variáveis de ambiente.
    base-url: ${NOTIFICACAO_URL:http://localhost:8089}
    token: ${NOTIFICACAO_TOKEN:token-de-desenvolvimento}
    connect-timeout: 500ms
    read-timeout: 1500ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html
